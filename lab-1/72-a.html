<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рисунок 3.13</title>
  <style>
    table {
      /* Главный эффект: слияние двойных границ в одну тонкую линию */
      border-collapse: collapse; 
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #000000;
      padding: 8px 12px;
    }

    /* Стили для шапки таблицы */
    th {
      background-color: #808080; /* Серый цвет фона */
      color: #000000;
      font-weight: bold;
      text-align: center;
    }

    /* Выравнивание чисел года по правому краю */
    td:first-child {
      text-align: right;
      width: 80px;
    }

    /* Выравнивание процентов по центру */
    td:not(:first-child) {
      text-align: center;
      width: 70px;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Год\Браузер</th>
      <th>IE</th>
      <th>Firefox</th>
      <th>Safari</th>
      <th>Opera</th>
    </tr>
    <tr>
      <td>2010</td>
      <td>61.43%</td>
      <td>24.40%</td>
      <td>4.55%</td>
      <td>2.37%</td>
    </tr>
    <tr>
      <td>2009</td>
      <td>69.13%</td>
      <td>22.67%</td>
      <td>3.58%</td>
      <td>2.18%</td>
    </tr>
    <tr>
      <td>2008</td>
      <td>77.83%</td>
      <td>16.86%</td>
      <td>2.65%</td>
      <td>1.84%</td>
    </tr>
    <tr>
      <td>2007</td>
      <td>79.38%</td>
      <td>14.35%</td>
      <td>4.70%</td>
      <td>0.50%</td>
    </tr>
  </table>

</body>
</html>
