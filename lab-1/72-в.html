<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рисунок 3.15 - Задание 3.3.б, в</title>
  <style>
    table {
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    th, td {
      /* Внутренние границы ячеек отсутствуют */
      border: none; 
      padding: 8px 12px;
    }

    /* Пункт б): Стили для шапки таблицы */
    th {
      background-color: #a0a0a0; /* Тёмно-серый фон */
      color: #000000;
      font-weight: bold;
      text-align: center;
      /* Нижняя линия, отделяющая шапку от данных */
      border-bottom: 2px solid #000000; 
    }

    /* Пункт в): Одинаковая высота для строк с данными */
    tr {
      height: 35px; 
    }

    /* Пункт в): Чередование фона («зебра») с помощью классов, как в указании */
    .odd {
      background-color: #ffffff; /* Белый фон для нечетных строк */
    }
    
    .even {
      background-color: #f0f0f0; /* Светло-серый фон для четных строк */
    }

    /* Выравнивание чисел года по правому краю */
    td:first-child {
      text-align: right;
      width: 80px;
    }

    /* Выравнивание процентов по центру */
    td:not(:first-child) {
      text-align: center;
      width: 70px;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Год\Браузер</th>
      <th>IE</th>
      <th>Firefox</th>
      <th>Safari</th>
      <th>Opera</th>
    </tr>
    <!-- Применяем классы для создания эффекта зебры -->
    <tr class="odd">
      <td>2010</td>
      <td>61.43%</td>
      <td>24.40%</td>
      <td>4.55%</td>
      <td>2.37%</td>
    </tr>
    <tr class="even">
      <td>2009</td>
      <td>69.13%</td>
      <td>22.67%</td>
      <td>3.58%</td>
      <td>2.18%</td>
    </tr>
    <tr class="odd">
      <td>2008</td>
      <td>77.83%</td>
      <td>16.86%</td>
      <td>2.65%</td>
      <td>1.84%</td>
    </tr>
    <tr class="even">
      <td>2007</td>
      <td>79.38%</td>
      <td>14.35%</td>
      <td>4.70%</td>
      <td>0.50%</td>
    </tr>
  </table>

</body>
</html>
