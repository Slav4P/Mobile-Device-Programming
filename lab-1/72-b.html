<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рисунок 3.14</title>
  <style>
    table {
      border-collapse: collapse; /* Объединяем границы для точности линий */
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /* Убираем все стандартные границы и задаем внутренние отступы */
    th, td {
      border: none;
      padding: 8px 12px;
    }

    /* Стили для шапки таблицы */
    th {
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #000000; /* Первая разделительная линия (горизонтальная) */
    }

    /* Выравнивание чисел года по правому краю */
    td:first-child, th:first-child {
      text-align: right;
      width: 90px;
      /* Вторая разделительная линия (вертикальная) */
      border-right: 1px solid #000000; 
    }

    /* Выравнивание процентов по центру */
    td:not(:first-child) {
      text-align: center;
      width: 70px;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Год\Браузер</th>
      <th>IE</th>
      <th>Firefox</th>
      <th>Safari</th>
      <th>Opera</th>
    </tr>
    <tr>
      <td>2010</td>
      <td>61.43%</td>
      <td>24.40%</td>
      <td>4.55%</td>
      <td>2.37%</td>
    </tr>
    <tr>
      <td>2009</td>
      <td>69.13%</td>
      <td>22.67%</td>
      <td>3.58%</td>
      <td>2.18%</td>
    </tr>
    <tr>
      <td>2008</td>
      <td>77.83%</td>
      <td>16.86%</td>
      <td>2.65%</td>
      <td>1.84%</td>
    </tr>
    <tr>
      <td>2007</td>
      <td>79.38%</td>
      <td>14.35%</td>
      <td>4.70%</td>
      <td>0.50%</td>
    </tr>
  </table>

</body>
</html>
