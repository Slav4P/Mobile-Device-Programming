<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоговая таблица (Задания в, г*, д*)</title>
    <style>
        /* Общие настройки таблицы */
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            width: 550px;
            border: 2px solid #333333;
            
            /* задание д*): Добавляем фоновое изображение для таблицы */
            background-image: url('phon.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* задание в): Задаем одинаковую высоту строк */
        tr {
            height: 45px;
        }

        /* задание д*): Отключаем фон у ячеек (background: transparent), 
           чтобы было видно картинку сзади, и добавляем тень для читаемости текста */
        th, td {
            padding: 5px 15px;
            background: transparent; 
            color: #000000;
            text-shadow: 1px 1px 2px #ffffff, -1px -1px 2px #ffffff; 
        }

        /* Настройка шапки таблицы */
        th {
            font-weight: bold;
            border-bottom: 2px solid #333333;
        }

        /* задание г*): Реализуем чередование цвета фона у колонок (столбцов).
           Используем полупрозрачные цвета (rgba), чтобы фоновая картинка слегка просвечивала */
        
        /* Нечетные колонки (1-я с годами, 3-я Firefox, 5-я Opera) */
        th:nth-child(odd), td:nth-child(odd) {
            background-color: rgba(240, 240, 240, 0.6); 
        }

        /* Четные колонки (2-я IE, 4-я Safari) */
        th:nth-child(even), td:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.4); 
        }

        /* Выравнивание данных */
        .year {
            text-align: right;
            font-weight: bold;
        }
        .data {
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Год\Браузер</th>
            <th>IE</th>
            <th>Firefox</th>
            <th>Safari</th>
            <th>Opera</th>
        </tr>
        <tr>
            <td class="year">2010</td>
            <td class="data">61.43%</td>
            <td class="data">24.40%</td>
            <td class="data">4.55%</td>
            <td class="data">2.37%</td>
        </tr>
        <tr>
            <td class="year">2009</td>
            <td class="data">69.13%</td>
            <td class="data">22.67%</td>
            <td class="data">3.58%</td>
            <td class="data">2.18%</td>
        </tr>
        <tr>
            <td class="year">2008</td>
            <td class="data">77.83%</td>
            <td class="data">16.86%</td>
            <td class="data">2.65%</td>
            <td class="data">1.84%</td>
        </tr>
        <tr>
            <td class="year">2007</td>
            <td class="data">79.38%</td>
            <td class="data">14.35%</td>
            <td class="data">4.70%</td>
            <td class="data">0.50%</td>
        </tr>
    </table>

</body>
</html>
