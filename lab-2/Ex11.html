<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Перенаправление на другой сайт</h1>

    <p>Вы будете автоматически перенаправлены через <span id="timer">5</span> секунд...</p>
    <p>Если перенаправление не произошло, <a href="https://google.com">нажмите здесь</a>.</p>

    <script>
        function redirectToPage() {
            window.location.href = "https://google.com"; 
        }

        setTimeout(redirectToPage, 5000);

        var timeLeft = 5;
        var timerElement = document.getElementById("timer");

        var countdown = setInterval(function() {
            timeLeft--;
            timerElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
            }
        }, 1000);
    </script>

</body>
</html>
