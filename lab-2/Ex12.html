<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Работа со ссылками в JavaScript</h1>
    <hr>

    <p>
        <a href="document.pdf" onclick="return checkAcrobat()">
            Скачать документ в формате PDF
        </a>
    </p>

    <p>
        <a href="javascript:void(0)" onmouseover="changeBgColor('red')" onmouseout="changeBgColor('white')">
            Наведите сюда мышь, чтобы изменить цвет фона
        </a>
    </p>

    <script>
        function checkAcrobat() {
            var agreement = confirm("Для просмотра этого документа требуется программа Adobe Acrobat Reader.\nПродолжить загрузку?");
            
            return agreement;
        }

        function changeBgColor(color) {
            document.bgColor = color;
        }
    </script>

</body>
</html>
