<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    
    <script>
        function splitSubjects() {
            var subjects = ["Алгебра", "Геометрия", "Физика", "История", "Литература", "Русский язык"];

            var exactSciences = subjects.slice(0, 3);

            var humanities = subjects.slice(3, 6);

            document.write("<strong>Все предметы:</strong> " + subjects + "<br><br>");
            document.write("<strong>Точные науки:</strong> " + exactSciences + "<br>");
            document.write("<strong>Гуманитарные науки:</strong> " + humanities + "<br>");
        }
    </script>
</head>
<body>

    <h1>Разделение школьных предметов</h1>

    <script>
        splitSubjects(); 
    </script>

</body>
</html>
