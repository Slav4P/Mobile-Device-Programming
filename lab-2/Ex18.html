<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        function moveTxt() {
            var element = document.getElementById("ani1");
            
            var currentTop = parseInt(element.style.top) || 0;

            if (currentTop < 300) {
                element.style.top = (currentTop + 2) + "px";

                // вызываем функцию снова через каждые 15 миллисекунд
                setTimeout(moveTxt, 15);
            }
        }
    </script>
</head>
<body onload="moveTxt()">

    <!-- Начальная позиция: top: 10px, left: 50px -->
    <div id="ani1" style="position: absolute; left: 50px; top: 10px; font-weight: bold; font-size: 20px;">
        Текст, шагом марш!
    </div>

</body>
</html>
