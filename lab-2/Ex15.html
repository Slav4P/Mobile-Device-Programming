<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>

function colorchange()
{
    document.getElementById("head").style.color = "red";
}


function colorreset()
{
    document.getElementById("head").style.color = "";
}
</script>
</head>
<body>

<h1 id="head" onmouseover="colorchange()" onmouseout="colorreset()">
    Добро пожаловать на нашу страницу!
</h1>

</body>
</html>
