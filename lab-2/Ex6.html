<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 6 - Таблица степеней</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 5px 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<script>
    document.write("<table>");
    document.write("<tr><th>Степень</th><th>Результат</th></tr>");

    // Цикл for от 0 до 5 (для степеней от 2^0 до 2^5)
    for (var i = 0; i <= 5; i++) {
        // Вычисляем результат возведения 2 в степень i
        var result = Math.pow(2, i);

        // Формируем строку таблицы с помощью конкатенации
        document.write(
            "<tr>" +
                "<td>2<sup>" + i + "</sup></td>" +
                "<td>" + result + "</td>" +
            "</tr>"
        );
    }

    // Закрываем тег таблицы после окончания цикла
    document.write("</table>");
</script>

</body>
</html>
