<!DOCTYPE html>
<head>
    <title>Таблица 1</title>
</head>
<body>

    <table border="1" cellpadding="15" cellspacing="0" style="text-align: center;">
  <tr>
    <td rowspan="2" width="40">1</td>
    <td colspan="2" height="40" style="text-align: left;">2</td>
  </tr>
  <tr>
    <td width="40" height="40">3</td>
    <td width="40">4</td>
  </tr>
</table>

<table border="1" cellpadding="12" cellspacing="0" style="text-align: center; font-family: Arial, sans-serif;">
  <!-- Заголовки столбцов -->
  <tr>
    <td>-</td>
    <td style="background-color: #FF0000; color: white;">Красный<br>FF0000</td>
    <td style="background-color: #00FF00; color: black;">Зеленый<br>00FF00</td>
    <td style="background-color: #0000FF; color: white;">Синий<br>0000FF</td>
  </tr>
  
  <!-- Смешивание с Красным -->
  <tr>
    <td style="background-color: #FF0000; color: white;">Красный<br>FF0000</td>
    <td style="background-color: #FF0000; color: white;">Красный<br>FF0000</td>
    <td style="background-color: #FFFF00; color: black;">Желтый<br>FFFF00</td>
    <td style="background-color: #FF00FF; color: white;">Пурпурный<br>FF00FF</td>
  </tr>
  
  <!-- Смешивание с Зеленым -->
  <tr>
    <td style="background-color: #00FF00; color: black;">Зеленый<br>00FF00</td>
    <td style="background-color: #FFFF00; color: black;">Желтый<br>FFFF00</td>
    <td style="background-color: #00FF00; color: black;">Зеленый<br>00FF00</td>
    <td style="background-color: #00FFFF; color: black;">Бирюзовый<br>00FFFF</td>
  </tr>
  
  <!-- Смешивание с Синим -->
  <tr>
    <td style="background-color: #0000FF; color: white;">Синий<br>0000FF</td>
    <td style="background-color: #FF00FF; color: white;">Пурпурный<br>FF00FF</td>
    <td style="background-color: #00FFFF; color: black;">Бирюзовый<br>00FFFF</td>
    <td style="background-color: #0000FF; color: white;">Синий<br>0000FF</td>
  </tr>
</table>



</body>
</html>
